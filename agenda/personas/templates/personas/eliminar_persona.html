{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-body">
        <h5 class="card-title text-danger">Eliminar Persona</h5>
        <p class="mb-3">¿Seguro que deseas eliminar a <strong>{{ persona.nombre }} {{ persona.apellido }}</strong>?</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-sm">Sí, eliminar</button>
            <a href="{% url 'lista_personas' %}" class="btn btn-secondary btn-sm">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
